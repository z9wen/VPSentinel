name: Deployment CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate installation script
        run: |
          sh -n scripts/install-server.sh
          sh -n scripts/install-agent.sh

      - name: Validate dashboard JSON
        run: jq empty deploy/grafana/dashboards/*.json

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: |
          docker build --file server/Dockerfile --tag vpsentinel-server:ci .
          docker build --file web/Dockerfile --tag vpsentinel-web:ci web
