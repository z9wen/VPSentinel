name: Report CI Failure

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    name: Open failure issue
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          short_sha=${SOURCE_SHA:0:7}
          title="CI failure on main (${short_sha})"
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "${short_sha} in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            echo "Open issue #${existing} already tracks this commit."
            exit 0
          fi

          body=$(printf '%s\n\n- Conclusion: `%s`\n- Workflow run: %s\n' \
            "CI did not pass for commit ${SOURCE_SHA}." \
            "$SOURCE_CONCLUSION" \
            "$SOURCE_RUN_URL")

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$title" \
            --body "$body"
