apiVersion: 1

datasources:
  - name: VPSentinel PostgreSQL
    uid: vpsentinel-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: vpsentinel
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: vpsentinel
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
