services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpsentinel
      POSTGRES_USER: vpsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpsentinel -d vpsentinel"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GIN_MODE: release
      VPSENTINEL_LISTEN_ADDRESS: :8080
      VPSENTINEL_AGENT_TOKEN: ${VPSENTINEL_AGENT_TOKEN:?VPSENTINEL_AGENT_TOKEN must be set in .env}
      VPSENTINEL_NODE_ID: ${VPSENTINEL_NODE_ID:-primary-monitor}
      VPSENTINEL_DATABASE_URL: postgres://vpsentinel:${POSTGRES_PASSWORD}@postgres:5432/vpsentinel?sslmode=disable
      VPSENTINEL_AUTO_MIGRATE: "true"
      VPSENTINEL_DATABASE_START_TIMEOUT: 60s
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend: {}
